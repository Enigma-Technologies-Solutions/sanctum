name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast checks (Linux only, ~5 min) ───────────────────────────────────────
  # Runs first. The build matrix only starts after this passes, preventing
  # wasted platform minutes on code that doesn't compile or has lint errors.
  check:
    name: Lint & test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      # ── Frontend ────────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v6
        with:
          version: "10"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend build (TypeScript + Vite)
        run: pnpm build

      # ── Rust ────────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit + GTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpcsclite-dev

      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ── Full Tauri build matrix ────────────────────────────────────────────────
  # Verifies the app compiles and bundles correctly on all target platforms.
  # Runs in parallel across platforms after `check` passes.
  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64) — GitHub Actions M-series runner
          - name: macOS aarch64
            os: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: ''

          # macOS Intel (x86_64) — older GitHub Actions Intel runner
          - name: macOS x86_64
            os: macos-13
            rust-target: x86_64-apple-darwin
            tauri-args: ''

          # Windows x86_64
          - name: Windows x86_64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: ''

          # Linux x86_64
          - name: Linux x86_64
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: ''

          # Linux arm64 — Raspberry Pi 400/5 class hardware, and the only way
          # to get a .deb for them without a 40-minute build on the Pi itself.
          #
          # 22.04 rather than 24.04 is deliberate: its glibc (2.35) is older
          # than Raspberry Pi OS Bookworm's (2.36), so the package installs
          # there. A 24.04 build links against 2.39 and will not.
          - name: Linux arm64
            os: ubuntu-22.04-arm
            rust-target: aarch64-unknown-linux-gnu
            tauri-args: ''

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: "10"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - name: Install Linux WebKit + GTK deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpcsclite-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Build the full Tauri app (frontend + Rust backend + bundle).
      #
      # No signing secrets are injected in CI — the build produces unsigned
      # artifacts, and signed release builds happen in release.yml on tag push.
      # createUpdaterArtifacts is switched off for the same reason: with a
      # public key in tauri.conf.json and no private key in the environment,
      # `tauri build` refuses to run at all. A CI build is a compile-and-bundle
      # check, not something the update channel will ever serve, so it has no
      # business signing anything.
      #
      # shell: bash on every leg, Windows included. The default shell there is
      # PowerShell, which strips the double quotes out of the inline JSON and
      # hands the CLI `{bundle:{createUpdaterArtifacts:false}}` — not JSON, and
      # rejected with "key must be a string".
      - name: pnpm tauri build
        shell: bash
        run: pnpm tauri build ${{ matrix.tauri-args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          # Suppress macOS notarization in CI (no signing certs present)
          CI: true

      # Keep the Linux bundles. The arm64 .deb is the one that matters: it is
      # the only practical way to get Sanctum onto a Raspberry Pi without a
      # ~25-minute build on the Pi itself.
      - name: Upload Linux bundles
        if: startsWith(matrix.os, 'ubuntu-')
        uses: actions/upload-artifact@v4
        with:
          name: sanctum-${{ matrix.rust-target }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
          retention-days: 14
