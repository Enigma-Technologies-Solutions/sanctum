#
# Asks every outside contributor to sign CLA.md once, by commenting on their pull request.
# Signatures are stored in the `cla-signatures` branch of this repository.
#
# pull_request_target runs with a write token on pull requests from forks. That is safe here
# only because this workflow never checks out or runs the pull request's code. Keep it that way.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/Enigma-Technologies-Solutions/sanctum/blob/main/CLA.md
          branch: cla-signatures
          allowlist: en1gm4-sh,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
