name: Release

# Triggered by pushing a semver tag: git tag v1.2.3 && git push --tags
#
# Also runnable by hand (Actions → Release → Run workflow) as a build-only dry
# run. A dry run compiles the full platform matrix and uploads the installers
# as workflow artifacts, but creates no tag, no GitHub Release, and no
# latest.json — so the update channel is untouched and nothing becomes visible
# to users. Use it to prove the matrix is green before spending a real tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Release (${{ matrix.name }})
    permissions:
      contents: write   # required to create the GitHub Release and upload artifacts

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS universal binary (arm64 + x86_64 in one .dmg) ─────────────
          # Requires both Rust targets. tauri-action handles the lipo step.
          - name: macOS universal
            os: macos-latest
            artifact: macos-universal
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin

          # ── Windows x86_64 — produces .msi and .exe installers ──────────────
          - name: Windows x86_64
            os: windows-latest
            artifact: windows-x86_64
            rust-targets: ''
            tauri-args: ''

          # ── Linux x86_64 — produces .deb and .AppImage ──────────────────────
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: linux-x86_64
            rust-targets: ''
            tauri-args: ''

          # ── Linux arm64 — Raspberry Pi 400/5, arm64 laptops, arm servers ────
          # Built on 22.04 (glibc 2.35) so the .deb installs on Raspberry Pi OS
          # Bookworm (glibc 2.36). A 24.04 build would not.
          - name: Linux arm64
            os: ubuntu-22.04-arm
            artifact: linux-arm64
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: "10"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit + GTK deps
        if: startsWith(matrix.os, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpcsclite-dev

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── macOS signing, only when there is something to sign with ────────────
      #
      # The Tauri bundler decides to codesign on the *presence* of
      # APPLE_CERTIFICATE, not on its value. Passing the secret straight into
      # the tauri-action step set it to the empty string on a repo with no
      # certificate enrolled, so every macOS build tried to import an empty
      # .p12 and died with:
      #
      #   security: SecKeychainItemImport: One or more parameters passed to a
      #   function were not valid.
      #   failed to bundle project failed codesign application
      #
      # So the variables are exported here, into the job environment, and only
      # when the certificate secret is non-empty. Until the Developer ID cert
      # is enrolled the macOS leg builds unsigned instead of failing; once the
      # secrets land, signing and notarization switch on with no edit here.
      - name: Arm macOS signing
        if: startsWith(matrix.os, 'macos-')
        shell: bash
        env:
          APPLE_CERTIFICATE:          ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY:     ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:                   ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:              ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD:             ${{ secrets.APPLE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::No APPLE_CERTIFICATE secret — building macOS unsigned."
            echo "Gatekeeper will quarantine this .dmg; it is not shippable to users."
            exit 0
          fi
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                     APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD; do
            {
              echo "$var<<__SANCTUM_EOF__"
              printf '%s\n' "${!var}"
              echo "__SANCTUM_EOF__"
            } >> "$GITHUB_ENV"
          done
          echo "macOS signing armed."

      # ── tauri-action — builds, (optionally) signs, and uploads artifacts ─────
      #
      # SIGNING SECRETS — how to obtain each:
      #
      # ── macOS ────────────────────────────────────────────────────────────────
      #
      # APPLE_CERTIFICATE
      #   Base64-encoded Developer ID Application certificate (.p12).
      #   1. Apple Developer portal → Certificates → "Developer ID Application"
      #   2. Download the .p12 (set a password during export)
      #   3. base64 < cert.p12 | pbcopy  → paste as the secret value
      #
      # APPLE_CERTIFICATE_PASSWORD
      #   The password you set when exporting the .p12 above.
      #
      # APPLE_SIGNING_IDENTITY
      #   The Common Name of the certificate, e.g.:
      #   "Developer ID Application: Enigma Technologies Solutions (TEAMID)"
      #   Find it via: security find-identity -v -p codesigning
      #
      # APPLE_ID
      #   Your Apple ID email address used to log into developer.apple.com
      #
      # APPLE_TEAM_ID
      #   10-character alphanumeric string shown in the Apple Developer portal
      #   under Membership Details, e.g. "AB12CD34EF"
      #
      # APPLE_PASSWORD
      #   An app-specific password, NOT your Apple ID password.
      #   Generate at: https://appleid.apple.com → Security → App-Specific Passwords
      #   This is used by notarytool to submit the .dmg for notarization.
      #
      # ── Windows ──────────────────────────────────────────────────────────────
      #
      # WINDOWS_CERTIFICATE
      #   Base64-encoded PFX/P12 code-signing certificate.
      #   Option A — DigiCert / Sectigo EV cert (~$400/yr):
      #     Export from the certificate store: certmgr → your cert → Export → PFX
      #     base64 < cert.pfx → paste as the secret value
      #   Option B — Azure Trusted Signing (~$10/mo, recommended):
      #     Use tauri-plugin-azure-signing instead; WINDOWS_CERTIFICATE is not
      #     needed for Azure Trusted Signing — replace with:
      #       AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #       AZURE_ENDPOINT, AZURE_CODE_SIGNING_ACCOUNT_NAME, AZURE_CERTIFICATE_PROFILE_NAME
      #
      # WINDOWS_CERTIFICATE_PASSWORD
      #   Password protecting the PFX file above.
      #   Not required for Azure Trusted Signing.
      #
      # ── Linux ────────────────────────────────────────────────────────────────
      #   No code signing required for Linux distribution.
      #   AppImage and .deb packages are unsigned; consider GPG-signing the
      #   release assets separately for distributions that verify package hashes.
      #
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing + notarization is NOT listed here on purpose — see the
          # "Arm macOS signing" step above, which exports these only when a
          # certificate actually exists.

          # Windows signing (leave empty until cert is enrolled)
          WINDOWS_CERTIFICATE:          ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

          # ── Updater signing ──────────────────────────────────────────────────
          #
          # TAURI_SIGNING_PRIVATE_KEY
          #   Contents of the minisign private key generated by
          #   `pnpm tauri signer generate`. This is the root of trust for every
          #   update Sanctum ships — clients reject any payload it did not sign.
          #   Losing it means existing installs can never be updated again;
          #   leaking it means an attacker can push code to every install.
          #
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          #   Password set when generating the key. Required by the CLI even
          #   when empty.
          #
          # Without these two, tauri-action still builds, but emits no
          # latest.json and no .sig files — installed clients will find no
          # update. Signing is not optional for a release.
          TAURI_SIGNING_PRIVATE_KEY:          ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          # An empty tagName tells tauri-action to build only — no tag lookup,
          # no GitHub Release, no asset upload. That is what makes a manual run
          # a dry run; the tag-push path is unchanged.
          tagName:       ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName:   "Sanctum ${{ github.ref_name }}"
          releaseBody:   |
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            for what's new in this release.

            **Verify downloads** — SHA-256 checksums are attached to this release.
            macOS: open the .dmg normally; Gatekeeper will clear the notarized build.
            Windows: if SmartScreen blocks the installer, click "More info → Run anyway"
            until the signing cert has accrued enough reputation (or use an EV cert).
          releaseDraft:  true    # review before publishing; flip to false to auto-publish
          prerelease:    false
          args:          ${{ matrix.tauri-args }}

      # ── Dry-run artifacts ───────────────────────────────────────────────────
      #
      # On a tag push the installers are attached to the GitHub Release, so this
      # step is skipped. On a manual run there is no Release to attach to, and
      # the installers would otherwise be discarded with the runner — collect
      # them here so the build can actually be inspected and smoke-tested.
      #
      # The globs walk `**` because the macOS job builds into
      # target/universal-apple-darwin/ while the others build into target/.
      # Only installers are collected, not the unpacked .app/AppDir trees.
      - name: Upload dry-run installers
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: sanctum-dryrun-${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/rpm/*.rpm
