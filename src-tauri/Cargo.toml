[package]
name = "sanctum"
version = "0.2.0"
description = "Desktop sandbox for AI-generated HTML tools"
authors = ["Sanctum"]
edition = "2021"

[lib]
name = "sanctum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2", features = ["isolation"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
# Signed update channel. Update manifests and payloads are verified against the
# minisign public key in tauri.conf.json before anything is written to disk —
# an unsigned or tampered payload is rejected by the plugin, not by us.
tauri-plugin-updater = "2"
# sanctum:// links. Only the Rust side receives them (no capability exposes the plugin to a
# webview); every link ends in a confirmation the user must click. See registry/link.rs.
tauri-plugin-deep-link = "2"
# One running Sanctum: a second launch (which is how Windows and Linux deliver a link)
# hands its arguments to the first and exits.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
# Static capability scan — regex-based pattern scan.
# NOTE: a proper JS/AST parser (e.g. oxc) would be more accurate; dynamic eval
# and obfuscation can hide intent from any static scan. The runtime sandbox
# (CSP + empty capabilities) is the real security guarantee; the scan is advisory.
regex = "1"
url = "2"
# Screenshots and icons reach the interface as data: URLs, after their hash is checked.
base64 = "0.22"
# HTTP client for the registry (docs/registry-format.md). Same TLS stack as the updater
# (rustls with ring, already in the tree); no cookies, no automatic redirects, no
# decompression. Redirects and size/time limits are enforced in registry/fetch.rs so they
# can be tested without a network.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
# Only to install the ring crypto provider the way the updater does (reqwest is built
# without a provider). Already in the tree through the updater, so no new compile.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# SQLite — direct sqlx, not tauri-plugin-sql, because all DB operations
# in v0 flow through Tauri commands (Rust side). tauri-plugin-sql can be
# added later if the frontend ever needs direct DB access from JS.
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
mime_guess = "2"
# PC/SC smart card access. Binds the platform resource manager — WinSCard on
# Windows, pcsc-lite on Linux, the PCSC framework on macOS — all of which ship
# with the OS, so this adds no runtime dependency for users.
pcsc = "2"
chrono = { version = "0.4", features = ["serde"] }
# Clipboard access from Rust side (for ingest_from_clipboard command).
# arboard is cross-platform (macOS/Windows/Linux) and avoids exposing
# the clipboard plugin's JS-only API to Rust.
arboard = "3"
# Signed tool bundles: format and verification. Shared with the signing CLI so there
# is one implementation of what "verified" means.
sanctum-bundle = { path = "crates/sanctum-bundle" }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
# Faster incremental builds
incremental = true
