[package]
name = "sanctum-bundle"
version = "0.1.0"
edition = "2021"
description = "Signed tool bundles for Sanctum: format, signing and verification"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "sanctum_bundle"
path = "src/lib.rs"

[[bin]]
name = "sanctum-bundle"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
