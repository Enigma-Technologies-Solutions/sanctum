# Cloudflare Worker for https://enigmahq.sh/install/<app_id>. Deploy it yourself:
#   cd workers/install && npx wrangler deploy
# It needs no secrets, no KV, no bindings and makes no outbound requests.
name = "sanctum-install"
main = "index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "enigmahq.sh/install/*", zone_name = "enigmahq.sh" },
  { pattern = "enigmahq.sh/_/install.css", zone_name = "enigmahq.sh" },
]
